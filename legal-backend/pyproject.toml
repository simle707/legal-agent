[project]
name = "legal-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GHJ", email = "3033186393@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.115.*",
    "httpx==0.27.*",
    "numpy>=2.5.3",
    "openai>=3.16.2",
    "pathlib>=1.0.1",
    "pydantic==2.*",
    "pydantic-settings>=2.15.0",
    "python-docx>=1.2.0",
    "python-dotenv==1.*",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.4",
    "sse-starlette==2.*",
    "uvicorn==0.30.*",
]

[project.scripts]
legal-backend = "legal_backend:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
